<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Product — CM's Cake and Pastries Admin</title>
  <meta name="description" content="Edit existing bakery product details, stock, and price for CM's Cake and Pastries.">
  <meta name="view-transition" content="same-origin">
  <link rel="stylesheet" href="Inventory (Edit Product).css">
  <link rel="stylesheet" href="../adminShell.css">
  <script type="module" src="../staffAccess.js"></script>
</head>
<body data-screen="Admin Edit Product" data-allowed-roles="admin,manager">
  <div class="canvas">
    
    <!-- Sidebar -->
    <aside class="sidebar opening-admin-shell" aria-label="Staff Navigation Sidebar">
      <div class="admin-shell-header">
        <div class="admin-avatar">CM</div>
        <div><strong>CM's Cake &amp; Pastries</strong><span>STAFF Portal</span></div>
      </div>
      <nav class="admin-nav-list"></nav>
    </aside>

    <!-- Main Modal Container -->
    <main class="main-viewport" style="display: flex; justify-content: center; align-items: center; padding: 24px;">
      <div class="product-modal-standalone">
        
        <!-- Form Left -->
        <div class="product-form-left">
          <h1 class="modal-title">Edit Product</h1>

          <form id="standaloneEditForm" onsubmit="event.preventDefault(); window.location.href='Inventory.html';">
            <div class="modal-field">
              <label for="standaloneEditName" class="modal-field-label">Product Name</label>
              <input type="text" id="standaloneEditName" class="modal-input" value="Siopao Chicken" required>
            </div>

            <div class="modal-field">
              <label for="standaloneEditCat" class="modal-field-label">Category</label>
              <select id="standaloneEditCat" class="modal-input">
                <option value="snacks" selected>Snacks</option>
                <option value="pastries">Pastries</option>
                <option value="meal">Meal</option>
                <option value="beverages">Beverages</option>
              </select>
            </div>

            <div class="modal-row-two">
              <div class="modal-field" style="flex: 1;">
                <label for="standaloneEditPrice" class="modal-field-label">Unit Price (₱)</label>
                <input type="number" id="standaloneEditPrice" class="modal-input" value="35.00" step="0.50" required>
              </div>

              <div class="modal-field" style="flex: 1;">
                <label for="standaloneEditStock" class="modal-field-label">Current Stock</label>
                <input type="number" id="standaloneEditStock" class="modal-input" value="50" required>
              </div>
            </div>

            <div class="modal-field">
              <label for="standaloneEditDesc" class="modal-field-label">Description</label>
              <textarea id="standaloneEditDesc" class="modal-textarea">Steamed fluffy bun filled with savory chicken and aromatics.</textarea>
            </div>
          </form>
        </div>

        <!-- Meta Right -->
        <aside class="product-meta-right">
          <h2 class="meta-header-title">Product Details</h2>

          <div class="meta-image-card">
            <img src="../../Dine-in/siopao_chicken.jpg" alt="Siopao Chicken image">
          </div>

          <div class="meta-stock-status">
            <span class="meta-stock-label">Stock Status</span>
            <span class="meta-stock-count" style="color: #166534;">In Stock</span>
          </div>

          <div class="meta-info-box">
            <div class="meta-info-row">
              <span>Product ID:</span>
              <strong>#M001-A</strong>
            </div>
            <div class="meta-info-row">
              <span>Last Updated:</span>
              <strong>Today, 3:15 PM</strong>
            </div>
          </div>

          <div class="modal-actions-box">
            <button type="button" class="btn-modal-cancel" onclick="window.location.href='Inventory.html';">Cancel</button>
            <button type="button" class="btn-modal-save" onclick="alert('Product updated! Redirecting to Inventory.'); window.location.href='Inventory.html';">Update Product</button>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script type="module" src="../adminShell.js"></script>
</body>
</html>
