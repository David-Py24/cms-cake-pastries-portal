<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product — CM's Cake and Pastries Admin</title>
  <meta name="description" content="Add new bakery product to CM's Cake and Pastries catalog and inventory.">
  <meta name="view-transition" content="same-origin">
  <link rel="stylesheet" href="Inventory (Add Product).css">
  <link rel="stylesheet" href="../adminShell.css">
  <script type="module" src="../staffAccess.js"></script>
</head>
<body data-screen="Admin Add Product" data-allowed-roles="admin,manager">
  <div class="canvas">
    
    <!-- Sidebar -->
    <aside class="sidebar opening-admin-shell" aria-label="Staff Navigation Sidebar">
      <div class="admin-shell-header">
        <div class="admin-avatar">CM</div>
        <div><strong>CM's Cake &amp; Pastries</strong><span>STAFF Portal</span></div>
      </div>
      <nav class="admin-nav-list"></nav>
    </aside>

    <!-- Main Modal Container -->
    <main class="main-viewport" style="display: flex; justify-content: center; align-items: center; padding: 24px;">
      <div class="product-modal-standalone">
        
        <!-- Form Left -->
        <div class="product-form-left">
          <h1 class="modal-title">Add Product</h1>

          <form id="standaloneAddForm" onsubmit="event.preventDefault(); window.location.href='Inventory.html';">
            <div class="modal-field">
              <label for="standaloneName" class="modal-field-label">Product Name</label>
              <input type="text" id="standaloneName" class="modal-input" placeholder="e.g. Sliced Ube Moist Cake" required>
            </div>

            <div class="modal-field">
              <label for="standaloneCat" class="modal-field-label">Category</label>
              <select id="standaloneCat" class="modal-input">
                <option value="pastries">Pastries</option>
                <option value="snacks">Snacks</option>
                <option value="meal">Meal</option>
                <option value="beverages">Beverages</option>
              </select>
            </div>

            <div class="modal-row-two">
              <div class="modal-field" style="flex: 1;">
                <label for="standalonePrice" class="modal-field-label">Unit Price (₱)</label>
                <input type="number" id="standalonePrice" class="modal-input" placeholder="60.00" step="0.50" required>
              </div>

              <div class="modal-field" style="flex: 1;">
                <label for="standaloneStock" class="modal-field-label">Initial Stock</label>
                <input type="number" id="standaloneStock" class="modal-input" placeholder="50" required>
              </div>
            </div>

            <div class="modal-field">
              <label for="standaloneDesc" class="modal-field-label">Description</label>
              <textarea id="standaloneDesc" class="modal-textarea" placeholder="Delicious freshly prepared item..."></textarea>
            </div>
          </form>
        </div>

        <!-- Meta Right -->
        <aside class="product-meta-right">
          <h2 class="meta-header-title">Product Details</h2>

          <div class="meta-image-card">
            <img src="../../Dine-in/chocolate_cake.jpg" alt="Product image preview">
          </div>

          <div class="meta-stock-status">
            <span class="meta-stock-label">Stock Status</span>
            <span class="meta-stock-count" style="color: #166534;">In Stock</span>
          </div>

          <div class="meta-info-box">
            <div class="meta-info-row">
              <span>Product ID:</span>
              <strong>#PRD-NEW</strong>
            </div>
            <div class="meta-info-row">
              <span>Status:</span>
              <strong>Active Catalog</strong>
            </div>
          </div>

          <div class="modal-actions-box">
            <button type="button" class="btn-modal-cancel" onclick="window.location.href='Inventory.html';">Cancel</button>
            <button type="button" class="btn-modal-save" onclick="alert('Product saved! Redirecting to Inventory.'); window.location.href='Inventory.html';">Add Product</button>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script type="module" src="../adminShell.js"></script>
</body>
</html>
